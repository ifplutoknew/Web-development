<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>SocialBook</title>
</head>
<body>
    <nav>
        <div class="nav-left">
            <img src="images/facebook.png" alt="logo" class="logo">
            <ul>
                <li><img src='images/notification.png' alt=""></li>
                <li><img src='images/mail-inbox-app.png' alt=""></li>
                <li><img src='images/video.png' alt=""></li>   
            </ul>
        </div>
        <div class="nav-right">
            <div class="search-box">
                <img src="images/search.png" alt="">
                <input type="text" placeholder="Search">
            </div>
            <div class="nav-user-icon online">
                <img src="images/profile-pic.jpeg" alt="">
            </div>
        </div>
    </nav>

    <div class="container">
        <!-------  left sidebar  ----->
        <div class="left-sidebar">
            <div class="imp-links">
                <a href="#"><img src="images/news.png" alt="news"> Latest News</a>
                <a href="#"><img src="images/friends (1).png" alt="friends"> Friends</a>
                <a href="#"><img src="images/group.png" alt="group"> Group</a>
                <a href="#"><img src="images/marketplace.png" alt=""> Marketplace</a>
                <a href="#"><img src="images/television.png" alt=""> Watch</a>
                <a href="#">See more</a>
            </div>

        </div>
        <!------ main content ------>
        <div class="main-content"></div>
        <!-----  right sidebar  -------->
        <div class="right-sidebar"></div>
    </div>
</body>
</html>

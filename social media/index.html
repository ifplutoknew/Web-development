<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>SocialBook</title>
</head>
<body>
    <nav>
        <div class="nav-left">
            <img src="images/facebook.png" alt="logo" class="logo">
            <ul>
                <li><img src='images/notification.png' alt=""></li>
                <li><img src='images/mail-inbox-app.png' alt=""></li>
                <li><img src='images/video.png' alt=""></li>   
            </ul>
        </div>
        <div class="nav-right">
            <div class="search-box">
                <img src="images/search.png" alt="">
                <input type="text" placeholder="Search">
            </div>
            <div class="nav-user-icon online">
                <img src="images/profile-pic.jpeg" alt="">
            </div>
        </div>
    </nav>

    <div class="container">
        <!-------  left sidebar  ----->
        <div class="left-sidebar">
            <div class="imp-links">
                <a href="#"><img src="images/news.png" alt="news"> Latest News</a>
                <a href="#"><img src="images/friends (1).png" alt="friends"> Friends</a>
                <a href="#"><img src="images/group.png" alt="group"> Group</a>
                <a href="#"><img src="images/marketplace.png" alt=""> Marketplace</a>
                <a href="#"><img src="images/television.png" alt=""> Watch</a>
                <a href="#">See more</a>
            </div>
            <div class="shortcut-links">
                <p>Your Shortcuts</p>
                <a href="#"><img src='images/shortcut-1.jpeg'> Web Developers</a>
                <a href="#"><img src='images/shortcut-2.jpeg'> Web Design course</a>
                <a href="#"><img src='images/shortcut-3.png'> Full Stack Development</a>
                <a href="#"><img src='images/shortcut-4.webp'> Website Expects</a>
            </div>

        </div>
        <!------ main content ------>
        <div class="main-content"></div>
        <!-----  right sidebar  -------->
        <div class="right-sidebar">
            <div class="sidebar-title">
                <h4>Events</h4>
                <a href="#">See All</a>
            </div>
            <div class="event">
                <div class="left-event">
                    <h3>18</h3>
                    <span>March</span>
                </div>
                <div class="right-event">
                    <h4>Social Media</h4>
                    <p>Willson Tech Park</p>
                    <a href="#">More Info</a>
                </div>
            </div>
            <div class="event">
                <div class="left-event">
                    <h3>22</h3>
                    <span>June</span>
                </div>
                <div class="right-event">
                    <h4>Mobile Marketing</h4>
                    <p>Willson Tech Park</p>
                    <a href="#">More Info</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Profile page - SocialBook</title>
</head>
<body>
    <nav>
        <div class="nav-left">
            <img src="images/facebook.png" alt="logo" class="logo">
            <ul>
                <li><img src='images/notification.png' alt=""></li>
                <li><img src='images/mail-inbox-app.png' alt=""></li>
                <li><img src='images/video.png' alt=""></li>   
            </ul>
        </div>
        <div class="nav-right">
            <div class="search-box">
                <img src="images/search.png" alt="">
                <input type="text" placeholder="Search">
            </div>
            <div class="nav-user-icon online" onclick="settingsMenuToggle()">
                <img src="images/profile-pic.jpeg">
            </div>
        </div>
<!---------------Settings Menu------------->
        <div class="settings-menu">

            <div id="dark-btn">
                <span></span>
            </div>

            <div class="settings-menu-inner">
                <div class="user-profile">
                    <img src="images/user-1.jpeg">
                    <div>
                        <p>John Stanson</p>
                        <a href="#">See your profile</a>
                    </div>
                </div>
                <hr> 
                <div class="user-profile">
                    <img src="images/review.png">
                    <div>
                        <p>Feedback</p>
                        <a href="#">Help us improve</a>
                    </div>
                </div>
                <hr>
                <div class="settings-links">
                    <img src="images/settings.png" class="settings-icon">
                    <a href="">Settings & Privacy <img src='images/right-arrow.png' width="10px"></a>
                </div>
                <div class="settings-links">
                    <img src="images/help-web-button.png" class="settings-icon">
                    <a href="">Help & Support <img src='images/right-arrow.png' width="10px"></a>
                </div>
                <div class="settings-links">
                    <img src="images/accessibility.png" class="settings-icon">
                    <a href="">Display & Accessibility <img src='images/right-arrow.png' width="10px"></a>
                </div>
                <div class="settings-links">
                    <img src="images/logout.png" class="settings-icon">
                    <a href="">Logout <img src='images/right-arrow.png' width="10px"></a>
                </div>


            </div> 
        </div>
    </nav>
<!----------Profile page ------------>
    <div class="profile-container">
        <img src="images/status-3.jpeg" class="cover-img">
        <div class="profile-details">
            <div class="pd-left">
                <div class="pd-row">
                    <img src="images/user-3.jpeg" class="pd-image">
                    <div>
                        <h3>Sarah Michaels</h3>
                        <p>120 Friends - 20 mutual</p>
                        <img src="images/user-1.jpeg">
                        <img src="images/user-2.jpeg">
                    </div>
                </div>
            </div>
            <div class="pd-right">
                <button type="button"><img src="images/add-friend.png"> Friend</button>
                <button type="button"><img src="images/chat (2).png"> Message</button>
                <a href=""><img src="images/more.png"></a>
            </div>
        </div>
    </div>
 
    <div class="footer">
        <p>Copyright 2025 - EasyWeb Youtube Channel</p>
    </div>
<script src="script.js"></script>
</body>
</html>

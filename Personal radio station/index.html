<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY RADIO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="radio">
        <h1>MY RADIO</h1>
        <div class="now-playing">
            <div class="cover"><img src="images/cover.jpeg"></div>
            <h2 id="songTitle">Song 1</h2>
            <p id="songArtist">My Radio</p>
        </div>
        <div class="progress-container">
            <span id="currentTime">0:00</span>
            <input type="range" id="progress" min="0" value="0" step="0.1">
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button id="previous"><img src="images/rewind-button.png"></button>
            <button id="play"><img src="images/play-button.png"></button>
            <button id="next"><img src="images/forward-button.png"></button>
        </div>

        <div class="volume">
            <img src="images/volume.png">
            <input type="range" id="volume" min="0" max="1" value="0.7" step="0.01">
        </div>

        <h3>Playlist</h3>
        <div id="playlist"></div>
        <audio id="audio"></audio>
    </div>
    <script src="javascript.js"></script>
</body>
</html>
